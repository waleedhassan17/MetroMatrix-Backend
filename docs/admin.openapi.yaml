# MetroMatrix admin console API — the contract between the backend and the
# admin app. Hand-maintained (scaffolded once from docs/ROUTES.json).
#
# Kept honest by src/__tests__/adminContract.test.js: every admin route must
# have an operation here and vice versa, and real responses are validated
# against these schemas. The app generates its types from this file.
openapi: 3.0.3
info:
  title: MetroMatrix admin console API
  version: 2.0.0
  description: >-
    Every admin endpoint (/api/admin, /api/v1/admin, /api/shopping/admin) answers in one envelope:


    - success: `{ success: true, data, meta? }` — `meta` pages lists (`page, limit, total, pages, nextCursor`); `limit`
    is clamped to 1–100.

    - failure: `{ success: false, error: { code, message, details? }, requestId }` — clients branch on `error.code` (see
    src/utils/errorCodes.js).


    Authentication: `Authorization: Bearer <accessToken>` from POST /api/admin/auth/login. Access tokens are
    short-lived; renew with POST /api/admin/auth/refresh-token (rotates the refresh token — replaying an old one revokes
    the session).

    A session may be restricted (`restrict: password_change | totp_enrol`) until the admin fixes their account.


    `x-guards` lists the permission guard of each operation (source: docs/ROUTES.json). Money, personal data and audit
    reads are guarded too.

    Status lists, labels, tones, limits and reference data come from GET /api/admin/meta — never hardcode them in a
    client.
servers:
  - url: /
    description: API host (Vercel)
tags:
  - name: Admin management
  - name: Analytics
  - name: Authentication
  - name: Console
  - name: Finance
  - name: Healthcare
  - name: Home services
  - name: Notifications
  - name: Own account
  - name: Posts
  - name: Provider onboarding (not admin console)
  - name: Providers
  - name: Settings
  - name: Shopping
  - name: Users
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationFailed:
      description: Validation failed (details.fields lists the problems)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Not signed in, token expired, or session revoked/idle
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission, super admin required, or session restricted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (e.g. DELETE_BLOCKED, INVALID_TRANSITION)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Too many failed attempts — see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Meta:
      type: object
      description: Paging for list responses. `page` is null when paging by cursor.
      required:
        - limit
      properties:
        page:
          type: integer
          nullable: true
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        nextCursor:
          type: string
          nullable: true
        counts:
          type: object
          additionalProperties: true
        unread:
          type: integer
        types:
          type: array
          items:
            type: object
            additionalProperties: true
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        requestId:
          type: string
          nullable: true
    Permissions:
      type: object
      additionalProperties:
        type: boolean
    AdminProfile:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - isSuperAdmin
        - permissions
        - isActive
        - mustChangePassword
        - twoFactorEnabled
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
            - super_admin
            - admin
            - moderator
        isSuperAdmin:
          type: boolean
        permissions:
          $ref: '#/components/schemas/Permissions'
        avatar:
          type: string
          nullable: true
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        passwordChangedAt:
          type: string
          format: date-time
          nullable: true
        twoFactorEnabled:
          type: boolean
        lastLoginDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        restrict:
          type: string
          nullable: true
          enum:
            - password_change
            - totp_enrol
            - null
        liveSessions:
          type: integer
    SessionTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - expiresInSeconds
        - sessionId
        - admin
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
        sessionId:
          type: string
        restrict:
          type: string
          nullable: true
          enum:
            - password_change
            - totp_enrol
            - null
        admin:
          $ref: '#/components/schemas/AdminProfile'
    LoginResult:
      type: object
      description: >-
        `step: 'signed_in'` carries the session tokens; `step: 'totp_required'` carries a 5-minute challenge token for
        POST /auth/login/totp.
      required:
        - step
      properties:
        step:
          type: string
          enum:
            - signed_in
            - totp_required
        challengeToken:
          type: string
        expiresInSeconds:
          type: integer
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
        restrict:
          type: string
          nullable: true
        admin:
          $ref: '#/components/schemas/AdminProfile'
    Session:
      type: object
      required:
        - id
        - createdAt
        - lastUsedAt
        - expiresAt
        - current
      properties:
        id:
          type: string
        deviceLabel:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true
        current:
          type: boolean
    HistoryEntry:
      type: object
      required:
        - id
        - action
        - createdAt
      properties:
        id:
          type: string
        action:
          type: string
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
        reason:
          type: string
          nullable: true
        before:
          nullable: true
        after:
          nullable: true
        createdAt:
          type: string
          format: date-time
    ProviderSummary:
      type: object
      required:
        - id
        - fullName
        - email
        - providerType
        - state
        - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
          nullable: true
        providerType:
          type: string
        providerSubType:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        profilePhoto:
          type: string
          nullable: true
        state:
          type: string
          enum:
            - incomplete
            - pending
            - approved
            - rejected
            - suspended
        submittedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        rating:
          type: object
          nullable: true
          properties:
            average:
              type: number
              nullable: true
            count:
              type: integer
        isOnline:
          type: boolean
    ProviderDetail:
      allOf:
        - $ref: '#/components/schemas/ProviderSummary'
        - type: object
          properties:
            emailVerified:
              type: boolean
            idNumber:
              type: string
              nullable: true
            documents:
              type: object
              additionalProperties: true
            suspendedReason:
              type: string
              nullable: true
            suspendedAt:
              type: string
              format: date-time
              nullable: true
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEntry'
    UserSummary:
      type: object
      required:
        - id
        - fullName
        - email
        - isActive
        - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
          nullable: true
        profilePhoto:
          type: string
          nullable: true
        isActive:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            counts:
              type: object
              required:
                - bookings
                - appointments
                - orders
                - posts
              properties:
                bookings:
                  type: integer
                appointments:
                  type: integer
                orders:
                  type: integer
                posts:
                  type: integer
            wallet:
              type: object
              nullable: true
              properties:
                balance:
                  type: number
                currency:
                  type: string
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEntry'
    DeletionResult:
      type: object
      required:
        - id
        - deletedAt
        - restorable
      properties:
        id:
          type: string
        deletedAt:
          type: string
          format: date-time
        restorable:
          type: boolean
    RestoreResult:
      type: object
      required:
        - id
        - restored
        - email
      properties:
        id:
          type: string
        restored:
          type: boolean
        email:
          type: string
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - message
        - severity
        - read
        - createdAt
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - info
            - success
            - warning
            - error
        target:
          type: object
          nullable: true
          properties:
            type:
              type: string
            id:
              type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Metric:
      type: object
      required:
        - key
        - label
        - value
        - unit
        - period
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
          nullable: true
        unit:
          type: string
        period:
          type: string
          enum:
            - today
            - now
            - month_to_date
            - all_time
        delta:
          type: number
          nullable: true
        comparedTo:
          type: string
    QueueSummary:
      type: object
      required:
        - type
        - label
        - count
        - requiredPermission
      properties:
        type:
          type: string
        label:
          type: string
        count:
          type: integer
          nullable: true
        oldestAt:
          type: string
          format: date-time
          nullable: true
        requiredPermission:
          type: string
        status:
          type: string
        detail:
          type: object
          additionalProperties: true
    QueueItem:
      type: object
      required:
        - type
        - id
        - requiredPermission
        - title
        - target
      properties:
        type:
          type: string
        id:
          type: string
        waitingSince:
          type: string
          format: date-time
          nullable: true
        requiredPermission:
          type: string
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        amount:
          type: object
          properties:
            value:
              type: number
            currency:
              type: string
        target:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            orderId:
              type: string
              nullable: true
    Vertical:
      type: object
      required:
        - label
        - status
        - headline
      properties:
        label:
          type: string
        status:
          type: string
          enum:
            - ok
            - unavailable
        headline:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
    Overview:
      type: object
      required:
        - generatedAt
        - timezone
        - currency
        - queues
        - kpis
        - verticals
        - recentActivity
      properties:
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
        currency:
          type: string
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueSummary'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        verticals:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Vertical'
        recentActivity:
          type: array
          items:
            type: object
            additionalProperties: true
    Option:
      type: object
      required:
        - value
        - label
        - tone
      properties:
        value:
          type: string
        label:
          type: string
        tone:
          type: string
          enum:
            - neutral
            - info
            - success
            - warning
            - danger
    ConsoleMeta:
      type: object
      required:
        - serverTime
        - timezone
        - currency
        - platform
        - viewer
        - limits
        - featureFlags
        - roles
        - permissions
        - superAdminOnly
        - enums
        - specialties
        - serviceCategories
        - cities
      properties:
        serverTime:
          type: string
          format: date-time
        timezone:
          type: string
        currency:
          type: string
        platform:
          type: object
          additionalProperties: true
        viewer:
          $ref: '#/components/schemas/AdminProfile'
        limits:
          type: object
          required:
            - maxPageSize
            - adjustmentApprovalThreshold
          properties:
            maxPageSize:
              type: integer
            adjustmentApprovalThreshold:
              type: number
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
        roles:
          type: array
          items:
            type: object
            additionalProperties: true
        permissions:
          type: array
          items:
            type: object
            required:
              - key
              - label
              - description
            properties:
              key:
                type: string
              label:
                type: string
              description:
                type: string
        superAdminOnly:
          type: array
          items:
            type: string
        enums:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        specialties:
          type: array
          items:
            type: object
            additionalProperties: true
        serviceCategories:
          type: array
          items:
            type: object
            additionalProperties: true
        cities:
          type: array
          items:
            type: string
    SettingsResponse:
      type: object
      required:
        - values
        - spec
      properties:
        values:
          type: object
          additionalProperties: true
        spec:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        lastUpdatedBy:
          type: string
          nullable: true
    SettingsUpdate:
      type: object
      required:
        - section
        - values
        - updatedAt
      properties:
        section:
          type: string
        values:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    WalletAdjustment:
      type: object
      required:
        - id
        - walletId
        - direction
        - amount
        - reason
        - status
      properties:
        id:
          type: string
        walletId:
          type: string
        direction:
          type: string
          enum:
            - credit
            - debit
        amount:
          type: number
        currency:
          type: string
        reason:
          type: string
        status:
          type: string
          enum:
            - pending
            - applying
            - applied
            - rejected
            - failed
        requiresApproval:
          type: boolean
        requestedBy:
          type: string
          nullable: true
        decidedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Reconciliation:
      type: object
      required:
        - totalUserBalance
        - totalProviderBalance
        - platformCommissionBalance
        - sumOfAllWallets
        - totalToppedUp
        - totalPaidOut
        - netAdjustments
        - expected
        - drift
        - balanced
        - computedAt
      properties:
        totalUserBalance:
          type: number
        totalProviderBalance:
          type: number
        platformCommissionBalance:
          type: number
        sumOfAllWallets:
          type: number
        totalToppedUp:
          type: number
        totalPaidOut:
          type: number
        netAdjustments:
          type: number
        expected:
          type: number
        drift:
          type: number
        balanced:
          type: boolean
        computedAt:
          type: string
          format: date-time
    GenericEnvelope:
      type: object
      description: Module endpoint in the standard envelope; `data` shape is module-specific (not yet typed here).
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    RegistrationAnalytics:
      type: object
      required:
        - range
        - users
        - providers
        - posts
      properties:
        range:
          type: object
          additionalProperties: true
        users:
          type: object
          additionalProperties: true
        providers:
          type: object
          additionalProperties: true
        posts:
          type: object
          additionalProperties: true
paths:
  /api/admin/admins:
    get:
      tags:
        - Admin management
      operationId: getAdminAdmins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminProfile'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
      x-guards:
        - requirePermission(canManageAdmins)
    post:
      tags:
        - Admin management
      operationId: postAdminAdmins
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - admin
                      - temporaryPassword
                    properties:
                      admin:
                        $ref: '#/components/schemas/AdminProfile'
                      temporaryPassword:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []
      x-guards:
        - requireSuperAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - fullName
              properties:
                email:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                permissions:
                  $ref: '#/components/schemas/Permissions'
  /api/admin/admins/{adminId}:
    get:
      tags:
        - Admin management
      operationId: getAdminAdminsAdminId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AdminProfile'
                      - type: object
                        properties:
                          storedPermissions:
                            $ref: '#/components/schemas/Permissions'
                          recentActions:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      x-guards:
        - requirePermission(canManageAdmins)
    patch:
      tags:
        - Admin management
      operationId: patchAdminAdminsAdminId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - admin
                      - sessionsSignedOut
                    properties:
                      admin:
                        $ref: '#/components/schemas/AdminProfile'
                      sessionsSignedOut:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      x-guards:
        - requirePermission(canManageAdmins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                fullName:
                  type: string
                isActive:
                  type: boolean
                role:
                  type: string
                permissions:
                  $ref: '#/components/schemas/Permissions'
                reason:
                  type: string
  /api/admin/admins/{adminId}/reset-2fa:
    post:
      tags:
        - Admin management
      operationId: postAdminAdminsAdminIdReset2fa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - twoFactorEnabled
                      - sessionsSignedOut
                    properties:
                      twoFactorEnabled:
                        type: boolean
                      sessionsSignedOut:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
      security:
