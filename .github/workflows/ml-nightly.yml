# Nightly ML batch: demand forecasts, provider-matching model, recommendations.
#
# Runs at 03:00 Pakistan time. Each job records itself in ml_job_runs and
# writes only ml_* collections (ml/mm_ml/db.py refuses anything else). Use a
# dedicated Atlas user: read on the source collections, readWrite on ml_*.
#
# Secrets: ML_MONGODB_URI (that user's connection string),
#          API_URL + INTERNAL_API_KEY (to tell the API to drop cached models/recs).
name: ml-nightly
on:
  schedule:
    - cron: '0 22 * * *' # 03:00 PKT
  workflow_dispatch:
    inputs:
      source:
        description: 'real or synthetic (demo data, labelled as such)'
        default: real

concurrency:
  group: ml-nightly
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml
    env:
      MONGODB_URI: ${{ secrets.ML_MONGODB_URI }}
      # Until that secret is configured the batch steps are skipped and the run
      # stays green, instead of failing every night.
      HAS_DB: ${{ secrets.ML_MONGODB_URI != '' }}
      GIT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SOURCE: ${{ github.event.inputs.source || 'real' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: No database configured
        if: env.HAS_DB != 'true'
        run: echo "::notice::ML_MONGODB_URI secret is not set; skipping the batch jobs"
      - name: Demand forecasts
        if: env.HAS_DB == 'true'
        run: python -m mm_ml.jobs.forecast_demand --source "$SOURCE"
      - name: Provider matching model
        if: env.HAS_DB == 'true'
        run: python -m mm_ml.jobs.train_matching --source "$SOURCE"
        continue-on-error: true
      - name: Recommendations
        if: env.HAS_DB == 'true'
        run: python -m mm_ml.jobs.recommend --source "$SOURCE"
        continue-on-error: true
      - name: Refresh API caches
        if: always() && env.HAS_DB == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$INTERNAL_API_KEY" ]; then
            curl -fsS --max-time 30 -X POST -H "x-internal-key: $INTERNAL_API_KEY" "${API_URL%/}/api/internal/ml/refresh" || true
          fi
